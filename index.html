<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Paroles OLED</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  body:not(.left) { padding-left: 16px; }
  body.left { padding-right: 16px; }
  :root { --c: 90,90,90; }
  #glow { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .7s;
    background: radial-gradient(90% 120% at 15% 100%, rgba(var(--c),.5), transparent 65%), radial-gradient(70% 100% at 100% 0%, rgba(var(--c),.22), transparent 60%); }
  body.vibes #glow { opacity: 1; }
  #app { position: relative; z-index: 1; display: flex; height: 100%; width: 100%; }
  #app { flex-direction: row-reverse; }
  body.left #app { flex-direction: row; }

  /* panneau : titre, boutons, timer — du côté de la Dynamic Island */
  #panel { flex: none; display: flex; flex-direction: column; justify-content: center; padding: 0 10px; }
  /* au-dessus de la Dynamic Island, tout contre le bord */
  #tl { position: fixed; z-index: 3; max-width: min(200px, 40vw); text-align: right;
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  #tl { top: calc(env(safe-area-inset-top, 0px) + 24px); right: 28px; }
  #bl { position: fixed; z-index: 3; display: flex; gap: 8px; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
  body.left #bl { right: auto; left: 14px; }
  body.left #tl { right: auto; left: 28px; text-align: left; align-items: flex-start; }
  #title { color: #666; font-size: 13px; line-height: 1.25; max-width: 100%; }
  #title b { display: block; color: #bbb; font-weight: 600; font-size: 14px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #ctl { display: flex; flex-direction: column; gap: 9px; }
  #ctl button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #222; background: #000;
    color: #fff; display: grid; place-items: center; padding: 0; }
  #ctl button:active { background: #222; }
  #bl button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #222; background: #000; color: #fff; padding: 0; display: grid; place-items: center; }
  #bl svg { width: 20px; height: 20px; fill: currentColor; }
  #bl button.on { background: #fff; color: #000; }
  #bl button.load { opacity: .5; }
  #ctl svg { width: 20px; height: 20px; fill: currentColor; }
  #ctl .pp svg:last-child, #ctl .pp.paused svg:first-child { display: none; }
  #ctl .pp.paused svg:last-child { display: block; }
  #time { color: #888; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* paroles condensées, alignées à gauche */
  #lyrics { flex: 1; min-width: 0; position: relative; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 38vh 10px 52vh 6px;
    -webkit-mask-image: linear-gradient(transparent 100px, #000 150px, #000 84%, transparent);
    mask-image: linear-gradient(transparent 100px, #000 150px, #000 84%, transparent); }
  #lyrics::-webkit-scrollbar { display: none; }
  .line { cursor: pointer; font-size: 20px; font-weight: 700; line-height: 1.2; margin: 0 0 14px; color: rgba(255,255,255,.22); letter-spacing: -.01em; text-wrap: pretty;
    transition: color .45s ease, font-size .45s ease, text-shadow .45s ease; }
  .line[data-d="2"] { color: rgba(255,255,255,.36); }
  .line[data-d="1"] { color: rgba(255,255,255,.58); }
  .t { display: none; font-size: .6em; font-weight: 500; opacity: .7; margin-top: 3px; letter-spacing: 0; }
  body.tr .t:not(:empty) { display: block; }
  .line.active { font-size: 27px; color: #fff; text-shadow: 0 0 16px rgba(255,255,255,.3); }

  #center { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 5; background: #000;
    text-align: center; padding: 30px; flex-direction: column; gap: 18px; color: #777; font-size: 17px; }
  #center button { background: #fff; color: #000; border: 0; border-radius: 999px;
    padding: 14px 28px; font-size: 17px; font-weight: 600; }
  #center.show { display: flex; }

  /* boutons discrets : ils s'effacent seuls, un toucher les ramène */
  #panel, #bl { transition: opacity .6s ease; }
  body.idle #panel, body.idle #bl { opacity: 0; pointer-events: none; }

  /* choisir une musique (appui long sur le titre) */
  #pick { position: fixed; inset: 0; z-index: 6; display: none; flex-direction: column; gap: 10px; background: #000;
    padding: max(22px, calc(env(safe-area-inset-top, 0px) + 10px)) calc(env(safe-area-inset-right, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 16px); }
  #pick.show { display: flex; }
  #ph { display: flex; gap: 10px; flex: none; }
  #q { flex: 1; min-width: 0; height: 40px; border-radius: 20px; border: 1px solid #333; background: #000; color: #fff;
    font: 16px -apple-system, system-ui, sans-serif; padding: 0 16px; outline: none; -webkit-user-select: text; user-select: text; }
  #px { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid #222; background: #000; color: #fff; padding: 0; display: grid; place-items: center; }
  #px svg { width: 18px; height: 18px; fill: currentColor; }
  #note { color: #777; font-size: 14px; flex: none; } #note:empty { display: none; }
  #pl { flex: 1; overflow-y: auto; scrollbar-width: none; display: grid; align-content: start; gap: 2px 12px;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  #pl::-webkit-scrollbar { display: none; }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px; border-radius: 12px; min-width: 0; }
  .row:active { background: #1a1a1a; }
  .cv { width: 44px; height: 44px; flex: none; border-radius: 6px; background: #161616 center / cover; display: grid; place-items: center; color: #aaa; font-size: 18px; }
  .row div:last-child { min-width: 0; flex: 1; }
  .row b, .row span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row b { font-size: 15px; font-weight: 600; } .row span { font-size: 13px; color: #777; margin-top: 2px; }
</style>
</head>
<body>
<div id="glow"></div>
<div id="app">
  <div id="panel">
    <div id="ctl">
      <button id="bPrev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="bPlay" class="pp" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>
      <button id="bNext" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
  </div>
  <div id="lyrics"></div>
</div>
<div id="tl"><div id="title"></div><div id="time"></div></div>
<div id="bl">
  <button id="bTr" aria-label="Traduction"><svg viewBox="0 0 24 24"><text x="1" y="14" font-size="13" font-family="-apple-system,sans-serif">文</text><text x="12" y="22" font-size="12" font-weight="700" font-family="-apple-system,sans-serif">A</text></svg></button>
  <button id="bVibes" aria-label="Couleurs de l'album"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg></button>
</div>
<div id="pick">
  <div id="ph"><input id="q" type="search" placeholder="Rechercher un titre" enterkeyhint="search" autocomplete="off" autocapitalize="off">
    <button id="px" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M5.3 3.9L12 10.6l6.7-6.7 1.4 1.4-6.7 6.7 6.7 6.7-1.4 1.4-6.7-6.7-6.7 6.7-1.4-1.4 6.7-6.7-6.7-6.7z"/></svg></button></div>
  <div id="note"></div><div id="pl"></div>
</div>
<div id="center"><span id="msg"></span><button id="btn" hidden></button></div>

<script>
// ====== CONFIG ======
const CLIENT_ID = "d4e620cf6f6e4cc4a20e98cffc377a66";
const REDIRECT_URI = "https://pomique.github.io/Paroles-Spotify/";
const SCOPES = "user-read-playback-state user-read-currently-playing user-modify-playback-state playlist-read-private playlist-read-collaborative user-library-read";
const OFFSET_MS = 250; // avance pour compenser la latence (ajuste si décalé)
// ====================

const $ = id => document.getElementById(id);
const titleEl = $("title"), box = $("lyrics"), center = $("center"), msg = $("msg"), btn = $("btn");
const bPlay = $("bPlay"), timeEl = $("time"), bTr = $("bTr"), bVibes = $("bVibes");
const LS = localStorage;

// ---------- Auth PKCE ----------
const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b => "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[b % 62]).join("");
async function login() {
  const verifier = rand(64);
  LS.setItem("verifier", verifier);
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  const challenge = btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT_URI,
    scope: SCOPES, code_challenge_method: "S256", code_challenge: challenge });
}
async function tokenRequest(params) {
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: CLIENT_ID, ...params }) });
  if (!r.ok) throw new Error("token");
  const t = await r.json();
  LS.setItem("access", t.access_token);
  if (t.refresh_token) LS.setItem("refresh", t.refresh_token);
  LS.setItem("expires", Date.now() + t.expires_in * 1000 - 60000);
}
async function getToken() {
  if (Date.now() < +LS.getItem("expires")) return LS.getItem("access");
  await tokenRequest({ grant_type: "refresh_token", refresh_token: LS.getItem("refresh") });
  return LS.getItem("access");
}
function show(text, button, action) {
  msg.textContent = text; center.classList.add("show");
  btn.hidden = !button; if (button) { btn.textContent = button; btn.onclick = action; }
}
const hide = () => center.classList.remove("show");

// ---------- Wake Lock (écran toujours allumé) ----------
let wl = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") {
    wl = await navigator.wakeLock.request("screen"); } } catch (e) {}
}
document.addEventListener("visibilitychange", keepAwake);

// ---------- Côté de la Dynamic Island ----------
let manualSide = null;
function placeSide() {
  let o = window.orientation;
  if (o === undefined) o = (screen.orientation && screen.orientation.angle) || 0;
  if (o === 270) o = -90;
  const s = manualSide || (o === 90 ? "left" : "right"); // 90 = île à gauche, -90 = île à droite
  document.body.classList.toggle("left", s === "left");
}
addEventListener("orientationchange", () => { manualSide = null; setTimeout(placeSide, 150); });
addEventListener("resize", placeSide);
titleEl.onclick = () => { manualSide = document.body.classList.contains("left") ? "right" : "left"; placeSide(); };
placeSide();

// ---------- Paroles (lrclib.net) ----------
const cache = {};
function parseLRC(txt) {
  const out = [];
  for (const raw of txt.split("\n")) {
    const m = raw.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
    if (m) out.push({ t: (+m[1]) * 60000 + parseFloat(m[2]) * 1000, text: m[3].trim() });
  }
  return out;
}
async function fetchLyrics(tr) {
  if (cache[tr.id] !== undefined) return cache[tr.id];
  const artist = tr.artists[0].name;
  let res = null;
  try {
    const q = new URLSearchParams({ artist_name: artist, track_name: tr.name,
      album_name: tr.album.name, duration: Math.round(tr.duration_ms / 1000) });
    let r = await fetch("https://lrclib.net/api/get?" + q);
    if (r.ok) res = await r.json();
    if (!res || !res.syncedLyrics) {
      r = await fetch("https://lrclib.net/api/search?" + new URLSearchParams({ artist_name: artist, track_name: tr.name }));
      if (r.ok) res = (await r.json()).find(x => x.syncedLyrics) || res;
    }
  } catch (e) {}
  const lines = res && res.syncedLyrics ? parseLRC(res.syncedLyrics) : null;
  return (cache[tr.id] = lines && lines.length ? lines : null);
}

// ---------- Affichage ----------
let lines = [], els = [], cur = -2, trackId = null, lastSec = -1;
let base = { progress: 0, at: 0, playing: false, duration: 0 };

function render(list) {
  box.innerHTML = ""; els = []; cur = -2;
  for (const l of list) {
    const p = document.createElement("p");
    p.className = "line";
    const o = document.createElement("span"), t = document.createElement("span");
    o.textContent = l.text || "♪"; t.className = "t"; p.append(o, t);
    box.appendChild(p); els.push(p);
  }
}
function setActive(i) {
  cur = i;
  els.forEach((el, k) => {
    const d = Math.abs(k - i);
    el.classList.toggle("active", d === 0);
    if (d > 0 && d < 3) el.dataset.d = d; else delete el.dataset.d;
  });
  if (performance.now() >= holdUntil) centerOn(i);
}
let holdUntil = 0, progUntil = 0;
function centerOn(i) {
  const el = els[i];
  if (!el) return;
  progUntil = performance.now() + 800; // scroll fait par l'app, pas par ton doigt
  box.scrollTo({ top: el.offsetTop - box.clientHeight * 0.4 + el.offsetHeight / 2 - 40, behavior: "smooth" });
}
box.addEventListener("scroll", () => { if (performance.now() > progUntil) holdUntil = performance.now() + 4000; });
const curPos = () => base.progress + (base.playing ? performance.now() - base.at : 0);
const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function tick(now) {
  const pos = curPos();
  if (lines.length) {
    const p = pos + OFFSET_MS;
    const n = lines.length;
    if (!(cur >= 0 && p >= lines[cur].t && (cur + 1 >= n || p < lines[cur + 1].t))) {
      let i = -1;
      for (let k = 0; k < n && lines[k].t <= p; k++) i = k;
      if (i !== cur) setActive(i);
    }
  }
  if (holdUntil && now >= holdUntil) { holdUntil = 0; if (cur >= 0) centerOn(cur); } // le suivi reprend
  const sec = Math.floor(pos / 1000);
  if (sec !== lastSec && base.duration) { lastSec = sec; timeEl.textContent = "-" + fmt(base.duration - pos); }
  requestAnimationFrame(tick);
}
function setPlayIcon() { bPlay.classList.toggle("paused", !base.playing); bPlay.setAttribute("aria-label", base.playing ? "Pause" : "Lecture"); }

// ---------- Commandes ----------
async function ctl(method, path) {
  try {
    const r = await fetch("https://api.spotify.com/v1/me/player/" + path, { method, headers: { Authorization: "Bearer " + await getToken() } });
    if (r.status === 401 || r.status === 403) show("Autorise le contrôle de la lecture (Spotify Premium requis).", "Se reconnecter", login);
  } catch (e) {}
  setTimeout(poll, 500);
}
$("bPrev").onclick = () => ctl("POST", "previous");
$("bNext").onclick = () => ctl("POST", "next");
bPlay.onclick = () => {
  const p = curPos();
  base = { ...base, progress: p, at: performance.now(), playing: !base.playing };
  setPlayIcon();
  ctl("PUT", base.playing ? "play" : "pause");
};

// ---------- Traduction (en français) ----------
const trCache = {};
async function gt(q) {
  const r = await fetch("https://translate.googleapis.com/translate_a/single", { method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client: "gtx", sl: "auto", tl: "fr", dt: "t", q }) });
  return (await r.json())[0].map(x => x[0]).join("");
}
async function translate(list) {
  const src = list.map(l => l.text || "");
  try { const out = (await gt(src.join("\n"))).split("\n"); if (out.length === src.length) return out; } catch (e) {}
  const res = [];
  for (let i = 0; i < src.length; i += 6) res.push(...await Promise.all(src.slice(i, i + 6).map(t => t ? gt(t).catch(() => "") : "")));
  return res;
}
async function ensureTr() {
  if (!document.body.classList.contains("tr") || !lines.length) return;
  const id = trackId; let out = trCache[id];
  if (!out) { bTr.classList.add("load"); try { out = trCache[id] = await translate(lines); } catch (e) {} bTr.classList.remove("load"); }
  if (id !== trackId) return;
  if (!out || !out.some(Boolean)) { document.body.classList.remove("tr"); bTr.classList.remove("on"); return; }
  els.forEach((el, k) => { const o = (lines[k].text || "").trim().toLowerCase(), t = (out[k] || "").trim();
    el.lastChild.textContent = t.toLowerCase() === o ? "" : t; });
  if (cur >= 0) setTimeout(() => centerOn(cur), 60);
}
bTr.onclick = () => {
  const on = document.body.classList.toggle("tr"); bTr.classList.toggle("on", on); LS.setItem("tr", on ? "1" : "");
  if (on) ensureTr(); else if (cur >= 0) setTimeout(() => centerOn(cur), 60);
};

// ---------- Ambiance aux couleurs de l'album ----------
function pickColor(url) {
  return new Promise(res => {
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => { try {
      const c = document.createElement("canvas"); c.width = c.height = 24;
      const x = c.getContext("2d"); x.drawImage(im, 0, 0, 24, 24);
      const d = x.getImageData(0, 0, 24, 24).data; let r = 0, g = 0, b = 0, w = 0;
      for (let i = 0; i < d.length; i += 4) {
        const wt = Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]) + 10;
        r += d[i] * wt; g += d[i + 1] * wt; b += d[i + 2] * wt; w += wt; }
      const k = 200 / (Math.max(r, g, b) / w || 1);
      res([r, g, b].map(v => Math.min(255, Math.round(v / w * k))));
    } catch (e) { res(null); } };
    im.onerror = () => res(null); im.src = url;
  });
}
bVibes.onclick = () => {
  const on = document.body.classList.toggle("vibes"); bVibes.classList.toggle("on", on); LS.setItem("vibes", on ? "1" : "");
};
if (LS.getItem("tr")) { document.body.classList.add("tr"); bTr.classList.add("on"); }
if (LS.getItem("vibes")) { document.body.classList.add("vibes"); bVibes.classList.add("on"); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

// toucher une phrase : Spotify saute au timecode de cette phrase
box.addEventListener("click", e => {
  if (tapWasIdle) { tapWasIdle = false; return; } // le 1er toucher ne fait que réafficher les boutons
  const i = els.indexOf(e.target.closest(".line"));
  if (i < 0 || !lines[i]) return;
  const ms = Math.max(0, Math.round(lines[i].t));
  base = { ...base, progress: ms, at: performance.now() };
  lastSec = -1; holdUntil = 0; setActive(i);
  ctl("PUT", "seek?position_ms=" + ms);
});

// ---------- Choisir une musique : appui long sur le titre ----------
const pick = $("pick"), pl = $("pl"), qEl = $("q"), noteEl = $("note"), tl = $("tl");
const note = t => noteEl.textContent = t || "";
const cover = im => im && im.length ? im[Math.min(1, im.length - 1)].url : null;
async function api(path, opt = {}) {
  const r = await fetch("https://api.spotify.com/v1/" + path, { ...opt, headers: { Authorization: "Bearer " + await getToken(), "Content-Type": "application/json" } });
  if (!r.ok) throw r.status;
  return r.status === 204 ? null : r.json();
}
function row(img, title, sub, tap) {
  const d = document.createElement("div"), c = document.createElement("div"), t = document.createElement("div");
  const a = document.createElement("b"), b = document.createElement("span");
  d.className = "row"; c.className = "cv"; if (img) c.style.backgroundImage = "url(" + img + ")"; else c.textContent = "♥";
  a.textContent = title; b.textContent = sub || ""; t.append(a, b); d.append(c, t); d.onclick = tap; return d;
}
async function playIt(body) {
  try { await api("me/player/play", { method: "PUT", body: JSON.stringify(body) }); closePick(); setTimeout(poll, 800); }
  catch (e) { note(e === 404 ? "Ouvre Spotify sur un appareil, puis réessaie." : e === 403 ? "Spotify Premium requis pour lancer un titre." : "Impossible de lancer ce titre."); }
}
async function loadLists() {
  pl.textContent = ""; note("");
  try {
    const d = await api("me/playlists?limit=50");
    pl.append(row(null, "Titres likés", "", async () => {
      try { const t = await api("me/tracks?limit=50"); playIt({ uris: t.items.map(x => (x.track || x.item).uri) }); }
      catch (e) { note("Titres likés indisponibles."); } }));
    d.items.filter(Boolean).forEach(p => pl.append(row(cover(p.images), p.name, p.owner && p.owner.display_name, () => playIt({ context_uri: p.uri }))));
  } catch (e) { note(e === 403 ? "Reconnecte-toi pour autoriser l'accès à tes playlists." : "Impossible de charger tes playlists."); }
}
function openPick() { pick.classList.add("show"); qEl.value = ""; loadLists(); }
function closePick() { pick.classList.remove("show"); qEl.blur(); }
$("px").onclick = closePick;
let qT = 0;
qEl.addEventListener("input", () => {
  clearTimeout(qT);
  qT = setTimeout(async () => {
    const q = qEl.value.trim();
    if (!q) { loadLists(); return; }
    try {
      const d = await api("search?type=track&limit=10&q=" + encodeURIComponent(q));
      pl.textContent = ""; note(d.tracks.items.length ? "" : "Aucun résultat.");
      d.tracks.items.forEach(t => pl.append(row(cover(t.album.images), t.name, t.artists.map(a => a.name).join(", "), () => playIt({ uris: [t.uri] }))));
    } catch (e) { note("Recherche indisponible."); }
  }, 400);
});
let longFired = false, lpTimer = 0;
tl.addEventListener("pointerdown", () => { longFired = false; lpTimer = setTimeout(() => { longFired = true; openPick(); }, 550); });
["pointerup", "pointercancel", "pointerleave"].forEach(ev => tl.addEventListener(ev, () => clearTimeout(lpTimer)));
tl.addEventListener("click", e => { if (longFired) { e.stopPropagation(); longFired = false; } }, true);

// ---------- Boutons discrets : ils s'effacent après 6 s, un toucher les ramène ----------
let idleT = 0, tapWasIdle = false;
function wake() {
  tapWasIdle = document.body.classList.contains("idle"); document.body.classList.remove("idle");
  clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 6000);
}
document.addEventListener("pointerdown", wake, true); wake();

// ---------- Boucle Spotify Connect ----------
async function poll() {
  if (document.hidden) return;
  try {
    const r = await fetch("https://api.spotify.com/v1/me/player", { headers: { Authorization: "Bearer " + await getToken() } });
    if (r.status === 204 || !r.ok) { idle("Aucune lecture en cours. Lance une musique sur Spotify, puis choisis cet appareil via Spotify Connect si besoin."); return; }
    const s = await r.json();
    if (!s.item || s.currently_playing_type !== "track") { idle("Pas de morceau détecté."); return; }
    hide();
    base = { progress: s.progress_ms, at: performance.now(), playing: s.is_playing, duration: s.item.duration_ms };
    setPlayIcon();
    if (s.item.id !== trackId) {
      trackId = s.item.id;
      titleEl.textContent = "";
      const bt = document.createElement("b"); bt.textContent = s.item.name;
      titleEl.append(bt, s.item.artists.map(a => a.name).join(", "));
      const im = s.item.album.images, u = im.length && im[im.length - 1].url;
      if (u) pickColor(u).then(c => { if (c) document.documentElement.style.setProperty("--c", c.join(",")); });
      lines = []; box.innerHTML = ""; box.scrollTop = 0;
      const l = await fetchLyrics(s.item);
      if (trackId !== s.item.id) return;
      if (l) { lines = l; render(l); ensureTr(); } else { box.innerHTML = '<p class="line" style="color:#555">Pas de paroles synchronisées pour ce titre.</p>'; }
    }
  } catch (e) {
    show("Session expirée ou erreur réseau.", "Se reconnecter", login);
  }
}
function idle(text) { trackId = null; lines = []; box.innerHTML = ""; titleEl.textContent = ""; timeEl.textContent = ""; base.playing = false; show(text); }

// ---------- Démarrage ----------
(async function init() {
  const code = new URLSearchParams(location.search).get("code");
  if (code) {
    try { await tokenRequest({ grant_type: "authorization_code", code, redirect_uri: REDIRECT_URI, code_verifier: LS.getItem("verifier") });
      LS.setItem("scopes", SCOPES); }
    catch (e) {}
    history.replaceState({}, "", REDIRECT_URI);
  }
  // nouvelle autorisation (contrôle de lecture) : reconnexion une seule fois
  if (LS.getItem("scopes") !== SCOPES) { ["access", "refresh", "expires"].forEach(k => LS.removeItem(k)); }
  if (!LS.getItem("refresh")) { show("Affiche les paroles synchronisées de ce que tu écoutes sur Spotify.", "Se connecter à Spotify", login); return; }
  // le wake lock demande parfois un geste : on réessaie au premier toucher
  keepAwake(); document.addEventListener("click", keepAwake, { once: true });
  poll(); setInterval(poll, 3000); requestAnimationFrame(tick);
})();
</script>
